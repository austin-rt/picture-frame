<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Picture Frame</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="frame">
        <div id="img-a" class="slide"></div>
        <div id="img-b" class="slide"></div>
        <video id="video-player" class="slide" muted playsinline></video>
    </div>
    <div id="video-bar">
        <div id="video-bar-track">
            <div id="video-bar-fill"></div>
        </div>
        <div id="video-time"></div>
    </div>
    <div id="clock"></div>
    <div id="drawer">
        <button class="drawer-btn" id="btn-fav">
            <svg viewBox="0 0 24 24" width="26" height="26">
                <path id="fav-path" d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" fill="none" stroke="white" stroke-width="2"/>
            </svg>
        </button>
        <button class="drawer-btn" id="btn-prev">
            <svg viewBox="0 0 24 24" width="26" height="26">
                <path d="M15.41 7.41L14 6l-6 6 6 6 1.41-1.41L10.83 12z" fill="white"/>
            </svg>
        </button>
        <button class="drawer-btn" id="btn-pause">
            <svg viewBox="0 0 24 24" width="26" height="26">
                <path id="pause-path" d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" fill="white"/>
            </svg>
        </button>
        <button class="drawer-btn" id="btn-next">
            <svg viewBox="0 0 24 24" width="26" height="26">
                <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z" fill="white"/>
            </svg>
        </button>
        <button class="drawer-btn" id="btn-bright-up">
            <svg viewBox="0 0 24 24" width="26" height="26">
                <circle cx="12" cy="12" r="4" fill="none" stroke="white" stroke-width="2"/>
                <path d="M12 2v3M12 19v3M4.22 4.22l2.12 2.12M17.66 17.66l2.12 2.12M2 12h3M19 12h3M4.22 19.78l2.12-2.12M17.66 6.34l2.12-2.12" stroke="white" stroke-width="2" stroke-linecap="round"/>
            </svg>
        </button>
        <button class="drawer-btn" id="btn-bright-down">
            <svg viewBox="0 0 24 24" width="26" height="26">
                <circle cx="12" cy="12" r="4" fill="none" stroke="white" stroke-width="2"/>
            </svg>
        </button>
        <button class="drawer-btn drawer-btn-danger" id="btn-power">
            <svg viewBox="0 0 24 24" width="26" height="26">
                <path d="M13 3h-2v10h2V3zm4.83 2.17l-1.42 1.42C18.18 7.84 19 9.81 19 12c0 3.87-3.13 7-7 7s-7-3.13-7-7c0-2.19.82-4.16 2.17-5.66L5.76 4.92A8.95 8.95 0 0 0 3 12a9 9 0 0 0 18 0c0-2.74-1.23-5.18-3.17-6.83z" fill="white"/>
            </svg>
        </button>
    </div>
    <script src="app.js"></script>
</body>
</html>
